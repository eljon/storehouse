<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --green: #1a4731;
      --green-2: #2d6a4f;
      --accent: #d4a24e;
      --bg: #f4f1ea;
      --card: #ffffff;
      --line: #e2ddd3;
      --text: #22201c;
      --muted: #77726a;
      --danger: #b23b3b;
      --warn: #c9821a;
      --ok: #2d6a4f;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.04);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.45;
    }
    header {
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: #fff; padding: 18px 16px 14px; position: sticky; top: 0; z-index: 20;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }
    header .brand { display:flex; align-items:center; gap:10px; }
    header .mark {
      width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
      color: var(--green); display:flex; align-items:center; justify-content:center;
      font-weight: 800; font-size: 18px; flex: none;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing:.2px; }
    header p { margin: 2px 0 0; font-size: 12px; opacity: .82; }

    .stats { display:flex; gap:8px; margin-top:14px; overflow-x:auto; padding-bottom:2px; }
    .stat {
      background: rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16);
      border-radius: 10px; padding: 7px 11px; min-width: 78px; flex: none;
    }
    .stat b { display:block; font-size: 18px; line-height:1.1; }
    .stat span { font-size: 10.5px; text-transform: uppercase; letter-spacing:.5px; opacity:.85; }

    nav {
      display:flex; background: var(--card); position: sticky; top: 0; z-index: 15;
      border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
    }
    nav button {
      flex:1; border:0; background:none; padding: 13px 6px 11px; font-size: 13px; font-weight:600;
      color: var(--muted); cursor:pointer; border-bottom: 3px solid transparent;
    }
    nav button.active { color: var(--green); border-bottom-color: var(--accent); }

    main { padding: 14px; max-width: 720px; margin: 0 auto 90px; }
    .tab { display:none; }
    .tab.active { display:block; animation: fade .18s ease; }
    @keyframes fade { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }

    .card { background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing:.6px; color: var(--muted); }

    label { display:block; font-size: 12.5px; font-weight:600; color: var(--muted); margin: 0 0 5px; }
    input, select, textarea {
      width:100%; padding: 11px 12px; border:1px solid var(--line); border-radius: 10px;
      font-size: 15px; background:#fff; color: var(--text); font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color: var(--green-2); box-shadow: 0 0 0 3px rgba(45,106,79,.12); }
    textarea { min-height: 60px; resize: vertical; }
    .field { margin-bottom: 12px; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }

    button.primary {
      background: var(--green); color:#fff; border:0; padding: 13px 16px; border-radius: 11px;
      font-size: 15px; font-weight: 700; width:100%; cursor:pointer;
    }
    button.primary:active { transform: translateY(1px); }
    button.primary[disabled] { opacity:.55; cursor: default; }
    button.ghost {
      background:#fff; color: var(--green); border:1px solid var(--green-2);
      padding: 10px 12px; border-radius: 10px; font-weight:600; cursor:pointer; font-size: 13.5px;
    }
    button.link { background:none; border:0; color: var(--danger); font-weight:600; cursor:pointer; font-size: 13px; padding:6px; }

    .search { display:flex; gap:8px; margin-bottom: 12px; }
    .search input { flex: 2; }
    .search select { flex: 1.2; }

    .item {
      display:flex; align-items:center; gap:10px; padding: 11px 12px; border:1px solid var(--line);
      border-radius: 12px; background:#fff; margin-bottom: 8px;
    }
    .item .meta { flex:1; min-width:0; }
    .item .name { font-weight:600; font-size: 14.5px; }
    .item .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .qty { text-align:right; flex:none; }
    .qty b { font-size: 17px; }
    .qty .u { font-size: 11px; color: var(--muted); }
    .pill { font-size: 10px; font-weight:700; padding: 2px 7px; border-radius: 20px; display:inline-block; margin-top:3px; }
    .pill.low { background: #fbefd6; color: var(--warn); }
    .pill.out { background: #f7dede; color: var(--danger); }
    .pill.ok  { background: #e0efe6; color: var(--ok); }

    .cat-head { font-size: 12px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
      color: var(--green); margin: 14px 2px 8px; display:flex; align-items:center; gap:8px; }
    .cat-head::after { content:""; flex:1; height:1px; background: var(--line); }

    .lineitem { display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
    .lineitem .sel { flex: 2.4; }
    .lineitem .num { flex: 1; }
    .lineitem .rm { flex:none; }

    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120px);
      background: var(--green); color:#fff; padding: 12px 18px; border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25); font-size: 14px; font-weight:600; z-index: 100;
      transition: transform .28s cubic-bezier(.2,.8,.2,1); max-width: 90%; text-align:center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--danger); }

    .empty { text-align:center; color: var(--muted); padding: 30px 10px; font-size: 14px; }
    .spinner { display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,.4);
      border-top-color:#fff; border-radius:50%; animation: spin .7s linear infinite; vertical-align:-4px; }
    @keyframes spin { to { transform: rotate(360deg);} }
    .loading { text-align:center; padding: 40px; color: var(--muted); }

    .tx { font-size: 13px; padding: 9px 2px; border-bottom:1px solid var(--line); display:flex; gap:10px; }
    .tx .badge { font-size:10px; font-weight:800; padding:3px 7px; border-radius:6px; height:fit-content; }
    .tx .badge.IN { background:#e0efe6; color: var(--ok); }
    .tx .badge.OUT { background:#f7dede; color: var(--danger); }
    .tx .d { flex:1; min-width:0; }
    .tx .d .t { font-weight:600; }
    .tx .d .s { color: var(--muted); font-size: 11.5px; }
    .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
    hr.soft { border:0; border-top:1px solid var(--line); margin: 12px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">BS</div>
      <div>
        <h1>Kalayaan Ward</h1>
        <p>Bishop's Storehouse &middot; Inventory</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav>
    <button data-tab="check" class="active" onclick="switchTab('check')">📦 Inventory</button>
    <button data-tab="out" onclick="switchTab('out')">📤 Output</button>
    <button data-tab="in" onclick="switchTab('in')">📥 Input</button>
  </nav>

  <main>
    <!-- ============ CHECK INVENTORY ============ -->
    <section id="tab-check" class="tab active">
      <div class="search">
        <input id="q" type="search" placeholder="Search items…" oninput="renderInventory()">
        <select id="catFilter" onchange="renderInventory()"><option value="">All categories</option></select>
      </div>
      <div id="invList"><div class="loading"><span class="spinner" style="border-color:#ccc;border-top-color:#1a4731"></span> Loading…</div></div>
    </section>

    <!-- ============ RECORD OUTPUT ============ -->
    <section id="tab-out" class="tab">
      <div class="card">
        <h2>Record Output — items taken out</h2>
        <div class="field">
          <label>Recipient name *</label>
          <input id="o_recipient" placeholder="e.g. Sister Reyes / Elders Quorum">
        </div>
        <div class="field">
          <label>Handled by</label>
          <input id="o_handled" placeholder="Your name (storehouse worker)">
        </div>

        <hr class="soft">
        <label>Items taken *</label>
        <div id="outLines"></div>
        <button class="ghost" type="button" onclick="addOutLine()">+ Add item</button>

        <hr class="soft">
        <div class="field">
          <label>Notes (optional)</label>
          <textarea id="o_notes" placeholder="Reason / approval / remarks"></textarea>
        </div>
        <button class="primary" id="o_submit" onclick="submitOutput()">Record Output</button>
      </div>
    </section>

    <!-- ============ RECORD INPUT ============ -->
    <section id="tab-in" class="tab">
      <div class="card">
        <h2>Record Input — items received</h2>
        <div class="field">
          <label>Item *</label>
          <select id="i_item" onchange="onInputItemChange()">
            <option value="">— Choose existing item —</option>
            <option value="__new__">➕ Add a NEW item…</option>
          </select>
        </div>

        <div id="newItemFields" style="display:none;">
          <div class="row">
            <div class="field">
              <label>New item name *</label>
              <input id="i_name" placeholder="Item name">
            </div>
            <div class="field">
              <label>Unit</label>
              <input id="i_unit" placeholder="pc / can / box">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>Category</label>
              <input id="i_cat" list="catList" placeholder="Category">
              <datalist id="catList"></datalist>
            </div>
            <div class="field">
              <label>Target / par level</label>
              <input id="i_target" type="number" min="0" inputmode="numeric" placeholder="0">
            </div>
          </div>
          <div class="field">
            <label>Notes / size</label>
            <input id="i_itemnotes" placeholder="e.g. 155g can">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Quantity received *</label>
            <input id="i_qty" type="number" min="1" inputmode="numeric" placeholder="0">
          </div>
          <div class="field">
            <label>Source</label>
            <input id="i_source" placeholder="Donor / purchase">
          </div>
        </div>
        <div class="field">
          <label>Handled by</label>
          <input id="i_handled" placeholder="Your name">
        </div>
        <div class="field">
          <label>Notes (optional)</label>
          <textarea id="i_notes" placeholder="Remarks"></textarea>
        </div>
        <button class="primary" id="i_submit" onclick="submitInput()">Record Input</button>
      </div>

      <div class="card">
        <h2>Recent activity</h2>
        <div id="txList"><div class="empty">No transactions yet.</div></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

<script>
  var DATA = { items: [], categories: [], stats: {} };
  var busy = false;

  /* ---------- boot ---------- */
  function boot() {
    google.script.run.withSuccessHandler(onData).withFailureHandler(onErr).getDashboard();
    google.script.run.withSuccessHandler(renderTx).getRecentTransactions(20);
  }

  function onData(d) {
    DATA = d;
    renderStats();
    fillCategoryFilter();
    fillItemSelectors();
    renderInventory();
    if (document.querySelectorAll('#outLines .lineitem').length === 0) addOutLine();
  }
  function onErr(e) { toast((e && e.message) || 'Something went wrong.', true); }

  /* ---------- tabs ---------- */
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===name); });
    document.getElementById('tab-'+name).classList.add('active');
    window.scrollTo(0,0);
  }

  /* ---------- stats ---------- */
  function renderStats() {
    var s = DATA.stats || {};
    var el = document.getElementById('stats');
    el.innerHTML =
      stat(s.distinctItems, 'Items') +
      stat(s.totalUnits, 'Total units') +
      stat(s.lowStock, 'Low stock') +
      stat(s.outOfStock, 'Out');
  }
  function stat(v, label){ return '<div class="stat"><b>'+(v||0)+'</b><span>'+label+'</span></div>'; }

  /* ---------- inventory list ---------- */
  function fillCategoryFilter() {
    var sel = document.getElementById('catFilter');
    var cur = sel.value;
    sel.innerHTML = '<option value="">All categories</option>';
    DATA.categories.forEach(function(c){
      var o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
    });
    sel.value = cur;
  }

  function statusPill(it) {
    if (it.quantity <= 0) return '<span class="pill out">OUT OF STOCK</span>';
    if (it.target > 0 && it.quantity < it.target) return '<span class="pill low">LOW</span>';
    return '<span class="pill ok">OK</span>';
  }

  function renderInventory() {
    var q = (document.getElementById('q').value || '').toLowerCase();
    var cat = document.getElementById('catFilter').value;
    var list = DATA.items.filter(function(it){
      if (cat && it.category !== cat) return false;
      if (q && (String(it.item).toLowerCase().indexOf(q) === -1) &&
               (String(it.notes).toLowerCase().indexOf(q) === -1)) return false;
      return true;
    });
    var box = document.getElementById('invList');
    if (!list.length) { box.innerHTML = '<div class="empty">No items match your search.</div>'; return; }

    var html = '', lastCat = null;
    list.forEach(function(it){
      if (it.category !== lastCat) { html += '<div class="cat-head">'+esc(it.category)+'</div>'; lastCat = it.category; }
      html += '<div class="item">'+
        '<div class="meta"><div class="name">'+esc(it.item)+'</div>'+
        '<div class="sub">'+esc(it.notes||'')+(it.target?(' &middot; par '+it.target):'')+'</div>'+
        statusPill(it)+'</div>'+
        '<div class="qty"><b>'+it.quantity+'</b> <span class="u">'+esc(it.unit||'')+'</span></div>'+
      '</div>';
    });
    box.innerHTML = html;
  }

  /* ---------- output ---------- */
  function itemOptions(selectedId) {
    var html = '<option value="">— Choose item —</option>';
    DATA.items.forEach(function(it){
      var label = it.item + ' ('+it.quantity+' '+it.unit+')';
      html += '<option value="'+it.id+'"'+(String(it.id)===String(selectedId)?' selected':'')+'>'+esc(label)+'</option>';
    });
    return html;
  }

  function addOutLine(selectedId) {
    var wrap = document.getElementById('outLines');
    var div = document.createElement('div');
    div.className = 'lineitem';
    div.innerHTML =
      '<div class="sel"><select class="ol-item">'+itemOptions(selectedId)+'</select></div>'+
      '<div class="num"><input class="ol-qty" type="number" min="1" inputmode="numeric" placeholder="Qty"></div>'+
      '<div class="rm"><button class="link" type="button" onclick="this.closest(\'.lineitem\').remove()">✕</button></div>';
    wrap.appendChild(div);
  }

  function submitOutput() {
    if (busy) return;
    var recipient = val('o_recipient');
    if (!recipient) return toast('Enter the recipient name.', true);

    var lines = [];
    var ok = true;
    document.querySelectorAll('#outLines .lineitem').forEach(function(row){
      var id = row.querySelector('.ol-item').value;
      var qty = Number(row.querySelector('.ol-qty').value);
      if (!id && !qty) return;                 // skip fully-empty rows
      if (!id || !(qty > 0)) { ok = false; return; }
      lines.push({ id: Number(id), quantity: qty });
    });
    if (!ok) return toast('Each item row needs both an item and a quantity.', true);
    if (!lines.length) return toast('Add at least one item.', true);

    var payload = { recipient: recipient, handledBy: val('o_handled'), notes: val('o_notes'), lines: lines };
    setBusy('o_submit', true, 'Recording…');
    google.script.run
      .withSuccessHandler(function(res){ afterWrite('o_submit','Record Output', res, resetOutput); })
      .withFailureHandler(function(e){ afterErr('o_submit','Record Output', e); })
      .recordOutput(payload);
  }

  function resetOutput() {
    ['o_recipient','o_handled','o_notes'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('outLines').innerHTML = '';
    addOutLine();
  }

  /* ---------- input ---------- */
  function fillItemSelectors() {
    var sel = document.getElementById('i_item');
    var cur = sel.value;
    sel.innerHTML = '<option value="">— Choose existing item —</option><option value="__new__">➕ Add a NEW item…</option>';
    DATA.items.forEach(function(it){
      var o = document.createElement('option'); o.value = it.id;
      o.textContent = it.item + ' ('+it.quantity+' '+it.unit+')';
      sel.appendChild(o);
    });
    sel.value = cur;

    var dl = document.getElementById('catList');
    dl.innerHTML = '';
    DATA.categories.forEach(function(c){ var o=document.createElement('option'); o.value=c; dl.appendChild(o); });
  }

  function onInputItemChange() {
    var isNew = document.getElementById('i_item').value === '__new__';
    document.getElementById('newItemFields').style.display = isNew ? 'block' : 'none';
  }

  function submitInput() {
    if (busy) return;
    var sel = document.getElementById('i_item').value;
    var qty = Number(val('i_qty'));
    if (!sel) return toast('Choose an item (or add a new one).', true);
    if (!(qty > 0)) return toast('Enter a quantity greater than zero.', true);

    var payload = { quantity: qty, source: val('i_source'), handledBy: val('i_handled'), notes: val('i_notes') };
    if (sel === '__new__') {
      var name = val('i_name');
      if (!name) return toast('Enter the new item name.', true);
      payload.id = null;
      payload.item = name;
      payload.category = val('i_cat') || 'Uncategorized';
      payload.unit = val('i_unit') || 'pc';
      payload.itemNotes = val('i_itemnotes');
      payload.target = Number(val('i_target')) || 0;
    } else {
      payload.id = Number(sel);
    }

    setBusy('i_submit', true, 'Recording…');
    google.script.run
      .withSuccessHandler(function(res){ afterWrite('i_submit','Record Input', res, resetInput); })
      .withFailureHandler(function(e){ afterErr('i_submit','Record Input', e); })
      .recordInput(payload);
  }

  function resetInput() {
    ['i_qty','i_source','i_notes','i_name','i_unit','i_cat','i_target','i_itemnotes'].forEach(function(id){
      document.getElementById(id).value='';
    });
    document.getElementById('i_item').value = '';
    onInputItemChange();
  }

  /* ---------- shared write handling ---------- */
  function afterWrite(btnId, label, res, resetFn) {
    setBusy(btnId, false, label);
    if (res && res.dashboard) onData(res.dashboard);
    resetFn();
    toast((res && res.message) || 'Saved.');
    google.script.run.withSuccessHandler(renderTx).getRecentTransactions(20);
  }
  function afterErr(btnId, label, e) {
    setBusy(btnId, false, label);
    toast((e && e.message) || 'Could not save.', true);
  }

  function renderTx(list) {
    var box = document.getElementById('txList');
    if (!list || !list.length) { box.innerHTML = '<div class="empty">No transactions yet.</div>'; return; }
    box.innerHTML = list.map(function(t){
      var party = t.party ? (t.type==='OUT' ? 'to '+t.party : 'from '+t.party) : '';
      return '<div class="tx"><span class="badge '+t.type+'">'+t.type+'</span>'+
        '<div class="d"><div class="t">'+t.quantity+' '+esc(t.unit||'')+' — '+esc(t.item)+'</div>'+
        '<div class="s">'+esc(party)+(t.handledBy?(' &middot; by '+esc(t.handledBy)):'')+'<br>'+esc(t.timestamp)+'</div></div></div>';
    }).join('');
  }

  /* ---------- utils ---------- */
  function val(id){ return (document.getElementById(id).value || '').trim(); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function setBusy(btnId, on, label){
    busy = on;
    var b = document.getElementById(btnId);
    b.disabled = on;
    b.innerHTML = on ? '<span class="spinner"></span> '+label : label;
  }
  var toastTimer;
  function toast(msg, isErr){
    var el = document.getElementById('toast');
    el.textContent = msg; el.className = 'toast show' + (isErr?' err':'');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = 'toast' + (isErr?' err':''); }, 3200);
  }

  boot();
</script>
</body>
</html>
